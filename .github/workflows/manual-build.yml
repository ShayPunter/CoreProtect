name: Manual Build
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Project branch to stamp into the build (e.g. "development")'
        required: true
        default: 'development'
jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B package -Dproject.branch="${{ inputs.branch }}"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect
          path: target/*.jar
          if-no-files-found: error
